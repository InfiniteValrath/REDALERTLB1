name: Update alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes — free-tier friendly; tighten later if you want
  workflow_dispatch: {}       # lets you click "Run workflow" manually to test

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "sitroom-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alerts.json
          git diff --cached --quiet || git commit -m "auto: refresh alerts"
          git push
