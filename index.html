<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SITROOM LIVE — Lebanon Watch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0d10; --panel:#10151a; --line:#232c33; --text:#d7dee2; --text-dim:#7d8b93;
         --amber:#e0a458; --teal:#4fd1c5; --red:#e0524f; --green:#6fbf73; }
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:0.85rem;}
  .frame{max-width:1100px;margin:0 auto;padding:20px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);
    padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:2rem;margin:0;color:#eef2f4;}
  h1 span{color:var(--amber);}
  .pill{border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:0.68rem;color:var(--text-dim);}
  .pill.live{color:var(--green);border-color:rgba(111,191,115,.4);}
  .pill.live::before{content:"●";margin-right:5px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:800px){.cols{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .panel h2{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;margin:0;padding:10px 14px;
    border-bottom:1px solid var(--line);color:#eef2f4;}
  .list{padding:10px 14px;max-height:520px;overflow-y:auto;}
  .row{border-bottom:1px dotted var(--line);padding:7px 0;font-size:0.78rem;line-height:1.5;}
  .row .t{color:var(--amber);font-weight:600;margin-right:8px;}
  .row .ch{color:var(--teal);font-size:0.65rem;display:block;margin-top:2px;}
  .empty{color:var(--text-dim);padding:20px 0;text-align:center;}
  a{color:var(--teal);}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>SIT<span>ROOM</span> LIVE</h1>
    <div>
      <span class="pill live" id="status">connecting…</span>
      <span class="pill" id="asof">last update —</span>
    </div>
  </header>

  <div class="cols">
    <div class="panel">
      <h2>Drone overflights</h2>
      <div class="list" id="drone"><div class="empty">Loading…</div></div>
    </div>
    <div class="panel">
      <h2>Strikes / other</h2>
      <div class="list" id="strike"><div class="empty">No strike channel configured yet — add one in scraper.py</div></div>
    </div>
  </div>
</div>

<script>
  const REFRESH_MS = 30000;

  async function load(){
    try{
      const res = await fetch('./data/alerts.json', {cache:'no-store'});
      const items = await res.json();
      render(items);
      document.getElementById('status').textContent = 'live · polling ' + (REFRESH_MS/1000) + 's';
      document.getElementById('asof').textContent = 'last update ' + new Date().toLocaleTimeString();
    }catch(e){
      document.getElementById('status').textContent = 'fetch failed — check data/alerts.json exists';
    }
  }

  function render(items){
    const drone = items.filter(i => i.type === 'drone');
    const strike = items.filter(i => i.type !== 'drone');
    fill('drone', drone);
    if (strike.length) fill('strike', strike);
  }

  function fill(id, items){
    const el = document.getElementById(id);
    if (!items.length){ el.innerHTML = '<div class="empty">No items yet</div>'; return; }
    el.innerHTML = items.slice(0,60).map(i => {
      const time = new Date(i.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      return `<div class="row"><span class="t">${time}</span>${escapeHtml(i.text)}<span class="ch">@${i.channel} · ${i.label}</span></div>`;
    }).join('');
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
